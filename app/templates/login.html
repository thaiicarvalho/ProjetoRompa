<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ROMPA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>
    <header class="navbar">
        <div class="navbar__inner">
            <a href="{{ url_for('main.index') }}" class="navbar__logo">ROMPA</a>
            <button class="navbar__toggle" id="nav-toggle" aria-label="Menu">
                <span></span><span></span><span></span>
            </button>
            <nav class="navbar__nav" id="nav-menu">
                <a href="{{ url_for('main.index') }}#sobre" class="navbar__link">Sobre</a>
                <a href="{{ url_for('main.index') }}#recursos" class="navbar__link">Recursos</a>
                <a href="{{ url_for('main.index') }}#contato" class="navbar__link">Contato</a>
                <a href="{{ url_for('auth.login') }}" class="navbar__btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                        <polyline points="10 17 15 12 10 7" />
                        <line x1="15" y1="12" x2="3" y2="12" />
                    </svg>
                    Entrar
                </a>
            </nav>
        </div>
    </header>

    <main class="login-page">
        <div class="container container--sm">
            <a href="{{ url_for('main.index') }}" class="back-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12" />
                    <polyline points="12 19 5 12 12 5" />
                </svg>
                Voltar
            </a>

            <div class="card card--shadow">
                <div class="login-card__header">
                    <h2 class="login-card__title">Entre na sua conta</h2>
                    <p class="login-card__sub">Acesse para assinar o Manifesto</p>
                </div>

                <div class="login-card__body">
                    <form method="POST" action="{{ url_for('auth.login') }}" class="login-form">
                        <div class="form-group">
                            <label for="login-username" class="form-label">Nome de usuário</label>
                            <div class="form-input-wrap">
                                <span class="form-input-icon" style="font-size:.85rem;font-weight:600;">@</span>
                                <input type="text" id="login-username" name="username"
                                    class="form-input form-input--icon-left" placeholder="seu_usuario"
                                    autocomplete="username" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="login-password" class="form-label">Senha</label>
                            <div class="form-input-wrap">
                                <span class="form-input-icon">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                    </svg>
                                </span>
                                <input type="password" id="login-password" name="password"
                                    class="form-input form-input--icon-left" placeholder="••••••••"
                                    autocomplete="current-password" required>
                            </div>
                        </div>

                        {% if erro %}
                        <div id="login-error" class="form-error">
                            {{ erro }}
                        </div>
                        {% endif %}

                        <button type="submit" class="btn btn--primary btn--full" id="login-submit">Entrar</button>
                    </form>

                    <p class="login-card__switch">
                        Não tem conta?
                        <a href="{{ url_for('auth.cadastro_aviso') }}" class="login-card__switch-link">Cadastre-se</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('nav-toggle')
            .addEventListener('click', function () {

                document.getElementById('nav-menu')
                    .classList.toggle('is-open');

            });
    </script>
</body>

</html>
