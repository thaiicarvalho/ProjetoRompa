<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado do Quiz — ROMPA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/quiz-resultado.css') }}">
</head>

<body>
    <header class="page-strip">
        <div class="page-strip__inner">
            <a href="tipos-violencia.html" class="back-link" style="margin-bottom:0;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12" />
                    <polyline points="12 19 5 12 12 5" />
                </svg>
                Tipos de Violência
            </a>
            <div class="page-strip__divider"></div>
            <span class="page-strip__label">Resultado</span>
        </div>
    </header>

    <main class="qres-page">
        <div class="container container--sm">
            <div class="qres-card">

                <div class="qres-circle-wrap">
                    <svg class="qres-circle-svg" viewBox="0 0 144 144" id="score-svg">
                        <circle cx="72" cy="72" r="60" fill="none" stroke="#e5e5e5" stroke-width="10" />
                        <circle cx="72" cy="72" r="60" fill="none" id="score-arc" stroke="#22c55e" stroke-width="10"
                            stroke-dasharray="376.99" stroke-dashoffset="376.99" stroke-linecap="round"
                            transform="rotate(-90 72 72)" />
                    </svg>
                    <div class="qres-circle-label">
                        <span class="qres-score" id="score-label">0/8</span>
                    </div>
                </div>

                <p class="qres-level" id="level-label"></p>
                <h2 class="qres-title" id="result-title"></h2>
                <p class="qres-msg" id="result-msg"></p>

                <div class="qres-breakdown">
                    <div class="qres-breakdown__item qres-breakdown__item--correct">
                        <div class="qres-breakdown__num" id="correct-count">0</div>
                        <div class="qres-breakdown__label">acertou</div>
                    </div>
                    <div class="qres-breakdown__item qres-breakdown__item--wrong">
                        <div class="qres-breakdown__num" id="wrong-count">0</div>
                        <div class="qres-breakdown__label">errou</div>
                    </div>
                </div>

                <div class="qres-actions">
                    <a href="{{ url_for('main.quiz') }}" class="btn btn--ghost">↺ Tentar novamente</a>
                    <a href="{{ url_for('main.tipos_violencia') }}" class="btn btn--primary">Explorar os tipos →</a>
                </div>
            </div>
        </div>
    </main>

    <script>

        var score = Number('{{ acertos }}');
        var total = Number('{{ total }}');
        var pct = Math.round(
            (score / total) * 100
        );

        document.getElementById('score-label')
            .textContent = score + '/' + total;

        document.getElementById('correct-count')
            .textContent = score;

        document.getElementById('wrong-count')
            .textContent = total - score;

        var circumference = 2 * Math.PI * 60;

        var offset = circumference * (
            1 - pct / 100
        );

        var arc = document.getElementById('score-arc');

        arc.style.strokeDashoffset = offset;

        arc.setAttribute(
            'stroke',
            '{{ resultado.cor }}'
        );

        document.getElementById('level-label')
            .textContent =
            'Nível: {{ resultado.nivel }}';

        document.getElementById('level-label')
            .style.color =
            '{{ resultado.cor }}';

        document.getElementById('result-title')
            .textContent =
            '{{ resultado.titulo }}';

        document.getElementById('result-msg')
            .textContent =
            '{{ resultado.mensagem }}';

    </script>
</body>

</html>
